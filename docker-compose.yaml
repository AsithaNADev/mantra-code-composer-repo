services:
      
  api-gateway:
    image: asankamadhawa/mantracode-bank-api-gateway:latest    
    ports:
      - "8765:8765"
    networks:
      - mantracode-bank-network
    depends_on:
      - naming-server   
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0
      
  transaction-service:
    image: asankamadhawa/mantracode-bank-transaction-service:latest    
    ports:
      - "8100:8100"
    networks:
      - mantracode-bank-network
    depends_on:
      - naming-server
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    # mem_limit: 1024m  # Increased to 1GB
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true -XX:MaxMetaspaceSize=150M -XX:ReservedCodeCacheSize=100M -Xmx500M -Xss512k -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions
      - JAVA_OPTS=-Djava.awt.headless=true
      - SPRING_JAVA_OPTS=-Djava.awt.headless=true
      - BPL_JVM_HEAD_ROOM=10
      - BPL_JVM_LOADED_CLASS_COUNT=35
      - BPL_JVM_THREAD_COUNT=
      - FONTCONFIG_PATH=/etc/fonts
      - FONTCONFIG_FILE=/etc/fonts/fonts.conf
      - _JAVA_OPTIONS=-Djava.awt.headless=true -Dnet.sf.jasperreports.awt.ignore.missing.font=true
    
      
  loan-service:
    image: asankamadhawa/mantracode-bank-loan-service:latest 
    ports:
      - "8200:8200"
    networks:
      - mantracode-bank-network
    depends_on:
      - naming-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Djava.awt.headless=true
      - JAVA_OPTS=-Djava.awt.headless=true
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 512M 
            
  customer-service:
    image: asankamadhawa/mantracode-bank-customer-service:latest    
    ports:
      - "8300:8300"
    networks:
      - mantracode-bank-network
    depends_on:
      - naming-server
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Djava.awt.headless=true
      - JAVA_OPTS=-Djava.awt.headless=true
            
  user-service:
    image: asankamadhawa/mantracode-bank-user-service:latest    
    ports:
      - "8000:8000"
    networks:
      - mantracode-bank-network
    depends_on:
      - naming-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Djava.awt.headless=true
      - JAVA_OPTS=-Djava.awt.headless=true 
      
  naming-server:
    image: asankamadhawa/mantracode-bank-naming-server:latest   
    ports:
      - "8761:8761"
    networks:
      - mantracode-bank-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 
                  
  zipkin-server:
    image: openzipkin/zipkin:2.23
    mem_limit: 300m
    ports:
      - "9412:9412"
    networks:
      - mantracode-bank-network
    restart: always #Restart if there is a problem starting up
    extra_hosts:
      - "host.docker.internal:host-gateway" 

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transaction  # Default database (can be used for transactions)
      MYSQL_USER: appdev
      MYSQL_PASSWORD: appdev   
      MYSQL_MULTIPLE_DATABASES: "user customer loan"
      MYSQL_USER_USER: appdev
      MYSQL_PASSWORD_USER: appdev
      MYSQL_USER_CUSTOMER: appdev
      MYSQL_PASSWORD_CUSTOMER: appdev
      MYSQL_USER_LOAN: appdev
      MYSQL_PASSWORD_LOAN: appdev  
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mantracode-bank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

networks:
  mantracode-bank-network:

volumes:
  mysql_data:
